version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # Hard-pinned to <2.4.0 in pyproject.toml (incompatible with Python 3.13);
      # bump only when the pin is deliberately lifted
      - dependency-name: "urllib3"
      # Must be bumped manually to match the live cluster's kubernetes version
      - dependency-name: "kubernetes-validate"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
